<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capture with PremiumShot</title><link rel="stylesheet" href="styles.css"><script src="popup.js" type="module"></script></head>
<body class="popup"><header class="popup-header"><span class="wordmark">Premium<span>Shot</span><i></i></span><span class="edition">FOR CHROME</span></header>
<h1>Something worth sharing?</h1><p class="popup-intro">Capture it. Give it a beautiful finish.</p>
<div class="capture-options">
  <button class="capture-option" data-mode="element"><span class="capture-glyph">⌖</span><span><strong>Select an element</strong><small>A card, chart, or component</small></span></button>
  <button class="capture-option" data-mode="viewport"><span class="capture-glyph">▣</span><span><strong>Capture visible tab</strong><small>Everything in the page viewport</small></span></button>
  <button class="capture-option" data-mode="area"><span class="capture-glyph">⌑</span><span><strong>Select an area</strong><small>Draw your own rectangle</small></span></button>
</div><p id="popup-status" class="popup-status" role="status" aria-live="polite"></p>
<footer class="popup-footer"><span class="local-dot"></span> Local processing · No account</footer></body></html>
