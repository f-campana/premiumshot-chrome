<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PremiumShot — Chrome store artwork</title>
  <style>
    *{box-sizing:border-box}body{margin:0;overflow:hidden;background:#efc3ae;color:#292c27;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    main{width:100vw;height:100vh;background:linear-gradient(118deg,#f4c4ae 0%,#e9c5d3 60%,#f1ce9f 100%);position:relative;overflow:hidden}
    .wordmark{display:flex;align-items:center;white-space:nowrap;font-size:28px;letter-spacing:-1px;font-weight:680;line-height:1.15}.wordmark span{font-weight:400}.wordmark i{height:7px;width:7px;border-radius:50%;margin:10px 0 0 4px;background:#9a7751}
    .brand{position:absolute;top:27px;left:28px;z-index:1}.edition{margin:9px 0 0;font-size:9px;font-weight:600;letter-spacing:1.9px;color:#4e554b}
    .finish{position:absolute;top:91px;left:28px;right:28px;width:calc(100% - 56px);height:auto;box-shadow:0 10px 22px #57433923}
    h1{display:none}
    @media(min-width:800px){.brand{top:76px;left:72px}.wordmark{font-size:38px;letter-spacing:-1.3px}.wordmark i{height:9px;width:9px;margin-top:14px}.edition{font-size:11px;margin-top:15px;letter-spacing:2.6px}h1{display:block;font-family:Georgia,"Times New Roman",serif;font-size:56px;font-weight:400;line-height:1.07;letter-spacing:-2px;margin:57px 0 0}.finish{left:auto;right:72px;top:138px;width:740px;box-shadow:0 16px 36px #57433929}}
  </style>
</head>
<body><main aria-label="PremiumShot promotional artwork"><div class="brand"><div class="wordmark">Premium<span>Shot</span><i aria-hidden="true"></i></div><p class="edition">FOR CHROME</p><h1>Screenshots,<br>worth sharing.</h1></div><img class="finish" src="dawn.png" alt="A real Dawn composition of the synthetic Meridian dashboard."></main></body>
</html>
